{% extends 'base.html' %}

{% block title %}Editar Producto | Barritas ERP{% endblock %}
{% block page_title %}Editar Producto: {{ producto.nombre }}{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="{{ url_for('productos') }}" class="btn btn-sm btn-outline-secondary">← Volver a Productos</a>
</div>

<div class="erp-card">
    <form action="{{ url_for('editar_producto', producto_id=producto.id) }}" method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" value="{{ producto.nombre }}" required>
            </div>
            <div class="form-group">
                <label for="marca">Marca:</label>
                <input type="text" id="marca" name="marca" value="{{ producto.marca }}" required>
            </div>
            <div class="form-group">
                <label for="sabor">Sabor:</label>
                <input type="text" id="sabor" name="sabor" value="{{ producto.sabor }}" required>
            </div>
            <div class="form-group">
                <label for="contenido_caja">Barritas por caja (Info):</label>
                <input type="number" id="contenido_caja" name="contenido_caja" value="{{ producto.contenido_caja | default(12) }}" required>
            </div>
            <div class="form-group">
                <label for="stock_cajas">Stock Actual (Cajas):</label>
                <input type="number" id="stock_cajas" name="stock_cajas" value="{{ producto.stock_cajas | default(0) }}" min="0" required>
            </div>
            <div class="form-group">
                <label for="stock_minimo">Stock Mínimo (Cajas):</label>
                <input type="number" id="stock_minimo" name="stock_minimo" value="{{ producto.stock_minimo | default(0) }}" min="0" required>
            </div>
            <div class="form-group">
                <label for="costo_caja">Costo de compra por caja ($):</label>
                <input type="number" id="costo_caja" step="0.01" name="costo_caja" value="{{ producto.costo_caja | default(0) }}" required>
            </div>
        </div>

        <h4 class="mt-4 mb-3">Precios de Venta por Caja</h4>
        <div class="form-grid">
            {% for tipo in tipos_cliente %}
            <div class="form-group">
                <label for="precio_tipo_{{ tipo.id }}">Precio {{ tipo.nombre }} ($):</label>
                <input type="number" id="precio_tipo_{{ tipo.id }}" step="0.01" name="precio_tipo_{{ tipo.id }}" value="{{ precios_map.get(tipo.id, 0.0) | default(0) }}" required>
            </div>
            {% endfor %}
        </div>

        <button type="submit" class="btn btn-primary mt-3">Guardar Cambios</button>
    </form>
</div>
{% endblock %}
