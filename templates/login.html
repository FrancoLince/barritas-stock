<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Gestión</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-card {
            max-width: 400px;
            border: none;
            border-radius: 12px;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card login-card shadow-sm p-4 w-100">
        <div class="card-body">
            <h3 class="text-center fw-bold mb-4 text-primary">Acceso al Sistema</h3>

            <!-- Mensajes Flash de error o aviso -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'danger' if category == 'error' else 'info' }} alert-dismissible fade show mb-3" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label font-weight-bold">Usuario</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Ingresá tu usuario" required autofocus>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label font-weight-bold">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Ingresá tu contraseña" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Ingresar</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
